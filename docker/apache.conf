<VirtualHost *:80>
    # Only html/ is served; state/ (settings, database) and data/ (downloads) sit beside it.
    DocumentRoot /var/www/torrentflux/html
    <Directory /var/www/torrentflux/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
